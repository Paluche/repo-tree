name: Validate pull request

on:
  pull_request:

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number
      || github.event.merge_group.head_ref
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-gitlint:
    name: gitlint
    # Do not run this check if the PR has been created by dependabot.
    if: contains(github.event.pull_request.user.login , 'dependabot[bot]') == false
    runs-on: ubuntu-latest

    steps:
      - run: pip install gitlint
      - name: Validate commits messages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const debugEnabled = process.env.ACTIONS_STEP_DEBUG === 'true';
            const pullRequestParams = {
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              pullRequestParams
            );

            // Start building the summary
            core.summary
              .addHeading('Gitlint Validation Report', 1)
              .addEOL()
              .addRaw(`**Total commits:** ${commits.length}`, true)
              .addEOL();

            let failedCount = 0;

            for (const data of commits) {
              const commitId = data.sha;
              const commitMessage = data.commit.message;
              const commitTitle = commitMessage.split('\n')[0];

              console.log(`Validating: ${commitId} - ${commitTitle}`);

              // Use temp file for gitlint to handle special characters safely.
              const tempDir = process.env.RUNNER_TEMP || '/tmp';
              const tempFile = path.join(
                tempDir,
                `commit-msg-${Math.random().toString(36).slice(2)}`
              );
              fs.writeFileSync(tempFile, commitMessage);

              const {
                exitCode,
                stderr
              } = await exec.getExecOutput(
                `gitlint`,
                [`--msg-filename`, `${tempFile}`],
                { silent: !debugEnabled, ignoreReturnCode: true }
              );

              if (exitCode === 0) {
                console.log(`✅ PASS`);
                core.summary.addRaw(
                  `- ✅ \`${commitId}\`: ${commitTitle}`,
                  true
                );
              } else {
                console.log(`❌ Failed`);
                console.log(stderr);
                core.summary
                  .addRaw(`- ❌ \`${commitId}\`: ${commitTitle}`, true)
                  .addEOL()
                  .addRaw(`\`\`\``, true)
                  .addRaw(stderr)
                  .addRaw(`\`\`\``, true);
                failedCount++;
              }
            }

            if (failedCount > 0) {
              core.setFailed(
                `Gitlint validation failed for ${failedCount} commit(s).`
              );
            } else {
              core.summary
                .addEOL()
                .addRaw(`All commits passed gitlint validation! 🎉`, true);
            }

            await core.summary.write();

  check-rustfmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - &pr-details
        name: Get PR details
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: pr-details
        with:
          script: |
            const pullRequestParams = {
              pull_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const { data: pullRequest } = await github.rest.pulls.get(
              pullRequestParams
            );
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              pullRequestParams
            );

            core.setOutput('fetch-depth', commits.length + 1);
            core.setOutput('total-commits', commits.length);
            core.setOutput('base-ref-sha', pullRequest.base.sha);
            core.setOutput('head-ref-sha', pullRequest.head.sha);

      - &checkout-pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ steps.pr-details.outputs.fetch-depth }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: nightly
          components: rustfmt

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const debugEnabled = process.env.ACTIONS_STEP_DEBUG === 'true';
            const pullRequestParams = {
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              pullRequestParams
            );

            // Start building the summary
            core.summary
              .addHeading('Rustfmt Validation Report', 1)
              .addEOL()
              .addRaw(`**Total commits:** ${commits.length}`, true)
              .addEOL();

            let failedCount = 0;

            for (const data of commits) {
              const commitId = data.sha;
              const commitTitle = data.commit.message.split('\n')[0];

              console.log(`Validating: ${commitId} - ${commitTitle}`);
              await exec.exec(
                'git',
                ['checkout', commitId],
                {silent: !debugEnabled}
              );
              const {
                exitCode,
                stdout,
              } = await exec.getExecOutput(
                `cargo`,
                [`+nightly`, `fmt`, `--all`, `--`, `--check`],
                { silent: !debugEnabled, ignoreReturnCode: true }
              );

              if (exitCode === 0) {
                console.log(`✅ PASS`);
                core.summary.addRaw(
                  `- ✅ \`${commitId}\`: ${commitTitle}`,
                  true
                );
              } else {
                console.log(`❌ Failed`);
                console.log(stdout);
                core.summary
                  .addRaw(`- ❌ \`${commitId}\`: ${commitTitle}`, true)
                  .addEOL()
                  .addDetails(`Details`, `\n\n\`\`\`diff\n${stdout}\`\`\`\n`)
                  .addEOL();
                failedCount++;
              }
            }

            if (failedCount > 0) {
              core.setFailed(
                `Rustfmt validation failed for ${failedCount} commit(s).`
              );
            } else {
              core.summary
                .addEOL()
                .addRaw(`All commits passed rustfmt validation! 🎉`, true);
            }

            await core.summary.write();

  check-clippy:
    name: clippy
    permissions:
      checks: write
    runs-on: ubuntu-24.04
    steps:
      - *pr-details
      - *checkout-pr
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const debugEnabled = process.env.ACTIONS_STEP_DEBUG === 'true';
            const pullRequestParams = {
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              pullRequestParams
            );

            // Start building the summary
            core.summary
              .addHeading('Clippy Validation Report', 1)
              .addEOL()
              .addRaw(`**Total commits:** ${commits.length}`, true)
              .addEOL();

            let failedCount = 0;

            for (const data of commits) {
              const commitId = data.sha;
              const commitTitle = data.commit.message.split('\n')[0];

              console.log(`Validating: ${commitId} - ${commitTitle}`);
              await exec.exec(
                'git',
                ['checkout', commitId],
                {silent: !debugEnabled}
              );
              const {
                exitCode,
                stderr,
              } = await exec.getExecOutput(
                `cargo`,
                [
                  `+stable`,
                  `clippy`,
                  `--all-features`,
                  `--color`, `never`,
                  `--workspace`,
                  `--all-targets`,
                  `--`,
                  `--deny`,
                  `warnings`,
                ],
                { silent: !debugEnabled, ignoreReturnCode: true }
              );

              if (exitCode === 0) {
                console.log(`✅ PASS`);
                core.summary.addRaw(
                  `- ✅ \`${commitId}\`: ${commitTitle}`,
                  true
                );
              } else {
                console.log(`❌ Failed`);
                console.log(stderr);
                core.summary
                  .addRaw(`- ❌ \`${commitId}\`: ${commitTitle}`, true)
                  .addEOL()
                  .addDetails(`Details`, `\n\n\`\`\`\n${stderr}\`\`\`\n`)
                  .addEOL();
                failedCount++;
              }
            }

            if (failedCount > 0) {
              core.setFailed(
                `Clippy validation failed for ${failedCount} commit(s).`
              );
            } else {
              core.summary
                .addEOL()
                .addRaw(`All commits passed clippy validation! 🎉`, true);
            }

            await core.summary.write();

  check-build:
    name: cargo build
    permissions:
      checks: write
    runs-on: ubuntu-24.04
    steps:
      - *pr-details
      - *checkout-pr
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUST_BACKTRACE: 1
          CARGO_TERM_COLOR: always
          RUSTFLAGS: -D warnings
        with:
          script: |
            const debugEnabled = process.env.ACTIONS_STEP_DEBUG === 'true';
            const pullRequestParams = {
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              pullRequestParams
            );

            // Start building the summary
            core.summary
              .addHeading('Build Validation Report', 1)
              .addEOL()
              .addRaw(`**Total commits:** ${commits.length}`, true)
              .addEOL();

            let failedCount = 0;

            for (const data of commits) {
              const commitId = data.sha;
              const commitTitle = data.commit.message.split('\n')[0];

              console.log(`Validating: ${commitId} - ${commitTitle}`);
              await exec.exec(
                'git',
                ['checkout', commitId],
                {silent: !debugEnabled}
              );
              const {
                exitCode,
                stderr,
              } = await exec.getExecOutput(
                `cargo`,
                [
                  `+stable`,
                  `build`,
                  `--all-features`,
                  `--workspace`,
                  `--all-targets`,
                ],
                { silent: !debugEnabled, ignoreReturnCode: true }
              );

              if (exitCode === 0) {
                console.log(`✅ PASS`);
                core.summary.addRaw(
                  `- ✅ \`${commitId}\`: ${commitTitle}`,
                  true
                );
              } else {
                console.log(`❌ Failed`);
                console.log(stderr);
                core.summary
                  .addRaw(`- ❌ \`${commitId}\`: ${commitTitle}`, true)
                  .addEOL()
                  .addDetails(`Details`, `\n\n\`\`\`\n${stderr}\`\`\`\n`)
                  .addEOL();
                failedCount++;
              }
            }

            if (failedCount > 0) {
              core.setFailed(
                `Build validation failed for ${failedCount} commit(s).`
              );
            } else {
              core.summary
                .addEOL()
                .addRaw(`All commits passed build validation! 🎉`, true);
            }

  check-tests:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: test
        env:
          REPO_TREE_DIR: /tmp
          RUST_BACKTRACE: 1
          CARGO_TERM_COLOR: always
        run: cargo test

  check-prettier:
    name: prettier
    permissions:
      checks: write
    runs-on: ubuntu-24.04
    steps:
      - *pr-details
      - *checkout-pr
      - run: npm ci prettier
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const debugEnabled = process.env.ACTIONS_STEP_DEBUG === 'true';
            const pullRequestParams = {
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            };

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              pullRequestParams
            );

            // Start building the summary
            core.summary
              .addHeading('Prettier Validation Report', 1)
              .addEOL()
              .addRaw(`**Total commits:** ${commits.length}`, true)
              .addEOL();

            let failedCount = 0;

            for (const data of commits) {
              const commitId = data.sha;
              const commitTitle = data.commit.message.split('\n')[0];

              console.log(`Validating: ${commitId} - ${commitTitle}`);
              await exec.exec(
                'git',
                ['checkout', commitId],
                {silent: !debugEnabled}
              );
              const {
                exitCode,
                stdout,
              } = await exec.getExecOutput(
                `npx`,
                [
                  `prettier`,
                  `--list-different`,
                  `--no-error-on-unmatched-pattern`,
                  `**/*.yml`, `**/*.yaml`,
                  `**/*.md`, `**/*.markdown`,
                  `**/*.json`,
                ],
                { silent: !debugEnabled, ignoreReturnCode: true }
              );

              if (exitCode === 0) {
                console.log(`✅ PASS`);
                core.summary.addRaw(
                  `- ✅ \`${commitId}\`: ${commitTitle}`,
                  true
                );
              } else {
                console.log(`❌ Failed`);
                console.log(stdout);
                core.summary
                  .addRaw(`- ❌ \`${commitId}\`: ${commitTitle}`, true)
                  .addEOL()
                  .addDetails(
                    `Files with bad formatting`,
                    `\n\n\`\`\`\n${stdout}\`\`\`\n`
                    )
                  .addEOL();
                failedCount++;
              }
            }

            if (failedCount > 0) {
              core.setFailed(
                `Prettier validation failed for ${failedCount} commit(s).`
              );
            } else {
              core.summary
                .addEOL()
                .addRaw(`All commits passed prettier validation! 🎉`, true);
            }

            await core.summary.write();

  check-zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - *checkout
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  check-codespell:
    name: codespell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run codespell
        run: uv run --frozen codespell

  merge-checks:
    name: Merge checks
    if: always()
    needs:
      - check-gitlint
      - check-rustfmt
      - check-clippy
      - check-build
      - check-tests
      - check-prettier
      - check-zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Block merge if required checks fail
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
        run: exit 1
