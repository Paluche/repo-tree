[project]
name = "repo-tree"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "codespell>=2.4.3",
    "zizmor>=1.30.1",
]

[tool.uv]
package = false

[tool.codespell]
# codespell must be run **from the repo root** for these settings
# to take effect.
check-filenames = true
check-hidden = true
# Codespell does not respect .gitignore. Do it for him here.
skip = "./target,./.jj,*.lock,./.git,./.venv,./.direnv,**/*.svg,**/package-lock.json,node_modules,.astro"
ignore-words-list = "crate,ser"
builtin = "clear,rare,en-GB_to_en-US"
